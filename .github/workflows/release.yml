name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  actions: read

env:
  REGISTRY: docker.io
  IMAGE_NAME: appwrite/utopia-base

# Promote the already-built, already-tested CI image (built on the
# release's target commit) to the release tag — no rebuild.
jobs:
  wait-for-ci:
    name: Wait for CI
    runs-on: ubuntu-24.04
    steps:
      - name: Wait for CI workflow on ${{ github.sha }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1800 ))  # 30 min
          while :; do
            run=$(gh run list --repo "$REPO" --workflow ci.yml --commit "$SHA" \
              --json databaseId,status,conclusion --limit 1)
            status=$(echo "$run" | jq -r '.[0].status // "missing"')
            conclusion=$(echo "$run" | jq -r '.[0].conclusion // ""')
            echo "CI status: $status, conclusion: $conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then exit 0; fi
              echo "CI did not succeed (conclusion=$conclusion)"; exit 1
            fi
            if [ "$(date +%s)" -gt "$deadline" ]; then
              echo "Timed out waiting for CI"; exit 1
            fi
            sleep 30
          done

  promote:
    name: Promote (${{ matrix.php-versions }})
    needs: wait-for-ci
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        php-versions: ['8.3', '8.4', '8.5']
    steps:
      - name: Login to DockerHub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=php-${{ matrix.php-versions }}-${{ github.event.release.tag_name }}

      - name: Promote multi-arch image
        run: |
          SRC=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:php-${{ matrix.php-versions }}-${{ github.sha }}
          for tag in ${{ steps.meta.outputs.tags }}; do
            docker buildx imagetools create -t "$tag" "$SRC"
          done
